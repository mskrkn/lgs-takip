<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Öğretmen Kaydı - EduPusula</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 20% 20%, #1a1f3d 0%, #070913 55%);
      font-family: 'Plus Jakarta Sans', sans-serif; color: #f8fafc; padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; background: rgba(17,24,48,0.75); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.09); border-radius: 20px; padding: 36px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 22px; }
    .logo-icon { font-size: 40px; }
    .logo h1 { font-size: 19px; margin: 8px 0 2px; }
    .logo p { font-size: 13px; color: #94a3b8; margin: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: #cbd5e1; }
    input, select {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.09);
      background: rgba(13,18,38,0.85); color: #f8fafc; font-size: 15px; outline: none;
    }
    input:focus, select:focus { border-color: #6366f1; }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-box, .success-box {
      display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
    }
    .error-box { background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.4); color: #fb7185; }
    .success-box { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: #4ade80; }
    .hint { text-align: center; margin-top: 18px; font-size: 12px; color: #64748b; }
    a { color: #a5b4fc; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070913">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduPusula">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/platform.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">
      <div class="logo-icon">🧭</div>
      <h1>Öğretmen Kaydı</h1>
      <p id="org-name-line">Kontrol ediliyor...</p>
    </div>

    <form id="register-form" style="display:none">
      <label for="displayName">Görünen İsim</label>
      <input type="text" id="displayName" required>

      <label>Girdiğiniz Sınıflar <span style="font-weight:400;color:#94a3b8">(birden fazla seçebilirsiniz)</span></label>
      <div id="class-checks" style="display:flex;flex-wrap:wrap;gap:8px"></div>

      <label for="homeroomClass">Sınıf Öğretmenliği <span style="font-weight:400;color:#94a3b8">(varsa)</span></label>
      <select id="homeroomClass"><option value="">Sınıf öğretmeni değilim</option></select>

      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" autocomplete="username" required>

      <label for="password">Şifre</label>
      <input type="password" id="password" autocomplete="new-password" required minlength="4">

      <button type="submit" id="submit-btn">Hesabımı Oluştur</button>
    </form>
    <div class="error-box" id="error-box"></div>
    <div class="success-box" id="success-box">✅ Hesabınız oluşturuldu! <a href="/login.html">Giriş yapmak için tıklayın</a>.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('kod') || '';
    const card = document.getElementById('card');
    const orgLine = document.getElementById('org-name-line');
    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');

    async function init() {
      if (!code) {
        orgLine.textContent = 'Davet linki geçersiz (kod eksik).';
        return;
      }
      try {
        const res = await fetch(`/api/register/teacher/${encodeURIComponent(code)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Davet kodu geçersiz.');
        orgLine.textContent = `${data.organizationName} okuluna öğretmen olarak katılıyorsunuz`;
        const checks = document.getElementById('class-checks');
        const homeroom = document.getElementById('homeroomClass');
        const esc = (t) => String(t).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        checks.innerHTML = (data.classNames || []).map(c =>
          `<label style="display:inline-flex;align-items:center;gap:6px;margin:0;padding:6px 10px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;font-weight:500;cursor:pointer">` +
          `<input type="checkbox" class="class-check" value="${esc(c)}" style="width:auto;padding:0"> ${esc(c)}</label>`).join('') ||
          '<span style="font-size:13px;color:#94a3b8">Okulda henüz sınıf tanımlı değil.</span>';
        const syncHomeroom = () => {
          const sel = [...document.querySelectorAll('.class-check:checked')].map(x => x.value);
          const cur = homeroom.value;
          homeroom.innerHTML = '<option value="">Sınıf öğretmeni değilim</option>' +
            sel.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
          if (sel.includes(cur)) homeroom.value = cur;
        };
        checks.addEventListener('change', syncHomeroom);
        form.style.display = 'block';
      } catch (err) {
        orgLine.textContent = err.message;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      if (!document.querySelector('.class-check:checked')) {
        errorBox.textContent = 'En az bir sınıf seçin.';
        errorBox.style.display = 'block';
        return;
      }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Oluşturuluyor...';
      try {
        const res = await fetch('/api/register/teacher', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code,
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            displayName: document.getElementById('displayName').value.trim(),
            classNames: [...document.querySelectorAll('.class-check:checked')].map(x => x.value),
            homeroomClass: document.getElementById('homeroomClass').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Kayıt başarısız.');
        form.style.display = 'none';
        successBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Hesabımı Oluştur';
      }
    });

    init();
  </script>
</body>
</html>
